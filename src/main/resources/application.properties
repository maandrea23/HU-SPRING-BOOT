spring.application.name=eventify

# H2 persiste los datos en ./data/eventify entre reinicios.
spring.datasource.url=jdbc:h2:file:./data/eventify
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Auditoría SQL: consultas y valores enlazados visibles en consola.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Puede desactivarse para iniciar el catálogo vacío.
eventify.seed.enabled=true

# La documentación pública se limita a los controladores REST.
springdoc.paths-to-match=/api/**
