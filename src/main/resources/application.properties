spring.application.name=eventify

# H2 guarda sus datos en ./data/eventify; por eso se conservan al reiniciar.
spring.datasource.url=jdbc:h2:file:./data/eventify
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Solo carga ejemplos si cada tabla está vacía.
eventify.seed.enabled=true
