<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Registrar lugar · Eventify')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main>
    <section class="tarjeta">
        <h1>Registrar lugar</h1>
        <form th:action="@{/admin/venues}" th:object="${venue}" method="post">
            <label for="nombre">Nombre</label>
            <input id="nombre" type="text" th:field="*{nombre}" th:errorclass="campo-invalido" required maxlength="100">
            <small class="error-texto" th:errors="*{nombre}"></small>
            <label for="direccion">Dirección</label>
            <input id="direccion" type="text" th:field="*{direccion}" th:errorclass="campo-invalido" required maxlength="200">
            <small class="error-texto" th:errors="*{direccion}"></small>
            <label for="capacidad">Capacidad</label>
            <input id="capacidad" type="number" th:field="*{capacidad}" th:errorclass="campo-invalido" required min="1">
            <small class="error-texto" th:errors="*{capacidad}"></small>
            <label for="ciudad">Ciudad</label>
            <input id="ciudad" type="text" th:field="*{ciudad}" th:errorclass="campo-invalido" required maxlength="100">
            <small class="error-texto" th:errors="*{ciudad}"></small>
            <div class="acciones"><button class="boton" type="submit">Guardar lugar</button><a class="boton" th:href="@{/admin}">Cancelar</a></div>
        </form>
    </section>
</main>
</body>
</html>
