<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">Eventify</title>
    <style>
        :root { color-scheme: light; font-family: Arial, sans-serif; }
        body { margin: 0; background: #f4f7fb; color: #172033; }
        nav { background: #172b4d; padding: 1rem max(1.2rem, calc((100% - 1100px) / 2)); }
        nav a { color: #fff; text-decoration: none; margin-right: 1.25rem; font-weight: 600; }
        main { max-width: 1100px; margin: 2rem auto; padding: 0 1.2rem; }
        .acciones { display: flex; gap: .75rem; flex-wrap: wrap; margin: 1rem 0 2rem; }
        .boton { background: #126e82; border: 0; border-radius: .35rem; color: #fff; cursor: pointer; display: inline-block; padding: .65rem 1rem; text-decoration: none; }
        .tarjeta { background: #fff; border-radius: .5rem; box-shadow: 0 2px 8px #17203318; margin: 1.25rem 0; padding: 1.25rem; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border-bottom: 1px solid #dbe3ef; padding: .7rem; text-align: left; }
        th { background: #edf3fa; }
        label { display: block; font-weight: 600; margin-top: .9rem; }
        input, textarea { box-sizing: border-box; font: inherit; margin-top: .3rem; padding: .55rem; width: 100%; }
        .alerta { border-radius: .35rem; margin: 1rem 0; padding: .8rem 1rem; }
        .exito { background: #ddf6e8; color: #14532d; }
        .error { background: #fee2e2; color: #991b1b; }
        .vacio { color: #52606d; font-style: italic; }
    </style>
</head>
<body>
<nav th:fragment="nav">
    <a th:href="@{/admin}">Eventify · Panel</a>
    <a th:href="@{/admin/events/nuevo}">Nuevo evento</a>
    <a th:href="@{/admin/venues/nuevo}">Nuevo lugar</a>
</nav>
</body>
</html>
